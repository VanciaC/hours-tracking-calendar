fragment CurrentUser on User {
  id
  name
  email
  role
}

query Me {
  me {
    ...CurrentUser
  }
}

# Shows or hides the sign-up link: only in OPEN mode (US-33).
query RegistrationMode {
  registrationMode
}

# Prefills the sign-up form from the emailed link. Null when the link is no longer valid.
query InvitationPreview($token: String!) {
  invitation(token: $token) {
    email
  }
}

mutation Register(
  $name: String!
  $email: String!
  $password: String!
  $passwordConfirmation: String!
  $locale: String
  $invitationToken: String
) {
  register(
    name: $name
    email: $email
    password: $password
    passwordConfirmation: $passwordConfirmation
    locale: $locale
    invitationToken: $invitationToken
  ) {
    email
    verified
  }
}

mutation ResendVerificationEmail($email: String!) {
  resendVerificationEmail(email: $email)
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(email: $email)
}

mutation ResetPassword($token: String!, $password: String!, $passwordConfirmation: String!) {
  resetPassword(token: $token, password: $password, passwordConfirmation: $passwordConfirmation)
}
