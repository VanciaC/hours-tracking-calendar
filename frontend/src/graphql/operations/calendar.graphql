fragment CalendarDay on WorkDay {
  id
  date
  mode
  durationMinutes
  note
  shifts {
    id
    startTime
    endTime
  }
}

# Everything the month calendar shows. Uses the $from and $to variables of the query that includes it.
fragment CalendarData on User {
  id
  workDays(from: $from, to: $to) {
    ...CalendarDay
  }
  hourlyRates {
    ...HourlyRateFields
  }
}

query Calendar($from: Date!, $to: Date!) {
  me {
    ...CalendarData
  }
}
