fragment CalendarDay on WorkDay {
  id
  date
  mode
  durationMinutes
  note
  shifts {
    id
    startTime
    endTime
  }
}

query Calendar($from: Date!, $to: Date!) {
  me {
    id
    workDays(from: $from, to: $to) {
      ...CalendarDay
    }
    hourlyRates {
      ...HourlyRateFields
    }
  }
}
