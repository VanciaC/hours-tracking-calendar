name: hours-tracking-calendar

# Configuration commune aux 3 services Laravel (environnement de dev).
x-laravel-service: &laravel-service
  build:
    context: ./docker/php
  environment: &laravel-env
    APP_ENV: local
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_USERNAME: app
    DB_PASSWORD: ${APP_DB_PASSWORD:-secret}
    PHP_CLI_SERVER_WORKERS: 4
    AUTH_GUARD: jwt
    JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
    JWT_ISSUER: hours-tracking-calendar-auth
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

# auth-service settings, shared by the web service and its optional scheduler.
x-auth-env: &auth-env
  <<: *laravel-env
  APP_NAME: Hours Tracking Calendar
  DB_DATABASE: auth
  JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private.pem
  JWT_TTL_MINUTES: 15
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@hours-tracking-calendar.local
  MAIL_FROM_NAME: Hours Tracking Calendar
  FRONTEND_URL: http://localhost:5173
  REFRESH_COOKIE_SECURE: "false"
  REGISTRATION_MODE: open

x-auth-volumes: &auth-volumes
  - ./services/auth-service:/var/www/html
  - ./secrets/jwt/private.pem:/run/secrets/jwt/private.pem:ro
  - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web interface, to read the emails

  auth-service:
    <<: *laravel-service
    environment: *auth-env
    volumes: *auth-volumes
    ports:
      - "8001:8000"

  # Laravel's scheduler, like in production. Not started by default: only with
  #   docker compose --profile scheduler up -d auth-scheduler
  auth-scheduler:
    <<: *laravel-service
    profiles: ["scheduler"]
    entrypoint: ["php", "artisan", "schedule:work"]
    working_dir: /var/www/html
    environment: *auth-env
    volumes: *auth-volumes
    # No web server here, so nothing answers on /up.
    healthcheck:
      disable: true
    depends_on:
      auth-service:
        condition: service_healthy

  planning-service:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      APP_NAME: planning-service
      DB_DATABASE: planning
    volumes:
      - ./services/planning-service:/var/www/html
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
    ports:
      - "8002:8000"

  payroll-service:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      APP_NAME: payroll-service
      DB_DATABASE: payroll
    volumes:
      - ./services/payroll-service:/var/www/html
      - ./secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
    ports:
      - "8003:8000"

  router:
    image: ghcr.io/apollographql/router:v2.19.0
    command: ["-c", "/dist/config/router.yaml", "-s", "/dist/schema/supergraph.graphql"]
    volumes:
      - ./router/router.yaml:/dist/config/router.yaml:ro
      - ./router/supergraph.graphql:/dist/schema/supergraph.graphql:ro
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      planning-service:
        condition: service_healthy
      payroll-service:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    # Runs as the "node" user (uid 1000) so that node_modules belongs to you, not to root
    user: node
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - router
      - auth-service

volumes:
  mysql-data: