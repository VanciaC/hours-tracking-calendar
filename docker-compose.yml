name: hours-tracking-calendar

# Configuration commune aux 3 services Laravel (environnement de dev).
x-laravel-service: &laravel-service
  build:
    context: ./docker/php
  environment: &laravel-env
    APP_ENV: local
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_USERNAME: app
    DB_PASSWORD: ${APP_DB_PASSWORD:-secret}
    PHP_CLI_SERVER_WORKERS: 4
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      APP_NAME: auth-service
      DB_DATABASE: auth
    volumes:
      - ./services/auth-service:/var/www/html
    ports:
      - "8001:8000"

  planning-service:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      APP_NAME: planning-service
      DB_DATABASE: planning
    volumes:
      - ./services/planning-service:/var/www/html
    ports:
      - "8002:8000"

  payroll-service:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      APP_NAME: payroll-service
      DB_DATABASE: payroll
    volumes:
      - ./services/payroll-service:/var/www/html
    ports:
      - "8003:8000"

  router:
    image: ghcr.io/apollographql/router:v2.19.0
    command: ["-c", "/dist/config/router.yaml", "-s", "/dist/schema/supergraph.graphql"]
    volumes:
      - ./router/router.yaml:/dist/config/router.yaml:ro
      - ./router/supergraph.graphql:/dist/schema/supergraph.graphql:ro
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      planning-service:
        condition: service_healthy
      payroll-service:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - router

volumes:
  mysql-data:
  frontend-node-modules:
