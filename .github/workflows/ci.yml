name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push on the same branch cancels the run still in progress: only the latest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the code.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Also type-checks: the build script runs tsc --noEmit first.
      - run: npm run build

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report every broken service, not just the first one.
      fail-fast: false
      matrix:
        service: [auth-service, planning-service, payroll-service]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Real environment variables win over .env, as in docker-compose.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      AUTH_GUARD: jwt
      JWT_ISSUER: hours-tracking-calendar-auth

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Throwaway keys, created for this run only: the real ones never leave the dev machine.
      - name: Generate JWT keys
        run: |
          mkdir -p "$RUNNER_TEMP/jwt"
          openssl genrsa -out "$RUNNER_TEMP/jwt/private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/jwt/private.pem" -pubout -out "$RUNNER_TEMP/jwt/public.pem"
          echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/jwt/private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/jwt/public.pem" >> "$GITHUB_ENV"

      # The database name lives in phpunit.xml (planning_testing...): read it there instead of repeating it here.
      - name: Create the test database
        run: |
          DB_NAME=$(grep -oP 'name="DB_DATABASE" value="\K[^"]+' phpunit.xml)
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\`"

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test
  supergraph:
    name: Supergraph
    runs-on: ubuntu-latest

    env:
      APP_ENV: local
      CACHE_STORE: array
      SESSION_DRIVER: array
      AUTH_GUARD: jwt
      JWT_ISSUER: hours-tracking-calendar-auth

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Generate JWT keys
        run: |
          mkdir -p "$RUNNER_TEMP/jwt"
          openssl genrsa -out "$RUNNER_TEMP/jwt/private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/jwt/private.pem" -pubout -out "$RUNNER_TEMP/jwt/public.pem"
          echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/jwt/private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/jwt/public.pem" >> "$GITHUB_ENV"

      # Same ports as docker-compose, so router/supergraph.yaml works unchanged.
      - name: Start the subgraphs
        run: |
          start() {
            (
              cd "services/$1"
              composer install --no-interaction --prefer-dist --no-progress
              cp .env.example .env
              php artisan key:generate
              php artisan serve --port="$2" > "$RUNNER_TEMP/$1.log" 2>&1 &
            )
          }
          start auth-service 8001
          start planning-service 8002
          start payroll-service 8003

          for port in 8001 8002 8003; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/up" > /dev/null && break
              sleep 1
            done
            curl -sf "http://localhost:$port/up" > /dev/null || { echo "Subgraph on port $port did not start"; exit 1; }
          done

      - name: Install Rover
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          echo "$HOME/.rover/bin" >> "$GITHUB_PATH"

      # Fails if the subgraphs do not compose (for example, two services disagree on User).
      - name: Compose the supergraph
        run: |
          rover supergraph compose \
            --config router/supergraph.yaml \
            --elv2-license accept \
            --output router/supergraph.graphql

      # Fails if a schema changed without running make supergraph: the router would serve a stale graph.
      - name: Check the committed supergraph is up to date
        run: |
          git diff --exit-code router/supergraph.graphql \
            || { echo "::error::router/supergraph.graphql is out of date. Run make supergraph and commit it."; exit 1; }

      - name: Show the subgraph logs
        if: failure()
        run: cat "$RUNNER_TEMP"/*-service.log