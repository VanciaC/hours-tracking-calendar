name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deployment at a time, never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The job only talks to the server over SSH, it needs no access to the repository.
permissions: {}

jobs:
  deploy:
    name: Deploy to production
    # Only after a green CI run triggered by a push on main (a merged pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is empty in the production environment." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # A key pasted from a Windows clipboard can carry CRLF line endings, which OpenSSH rejects.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Fail here with a clear message if the key cannot be read.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "DEPLOY_SSH_KEY is not a valid private key." >&2
            exit 1
          fi

      - name: Deploy the tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: >
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          "ubuntu@$DEPLOY_HOST" "$SHA"