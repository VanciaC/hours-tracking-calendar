#import federation.graphql

# ─── Scalars ────────────────────────────────────────────

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

# ─── User (federated, owned by auth-service) ────────────

"""
Reference to the user owned by auth-service.
planning-service contributes the user's work days.
"""
type User @key(fields: "id") {
    id: ID!
    "Work days recorded by the user over a period (inclusive bounds)."
    workDays(from: Date!, to: Date!): [WorkDay!]!
        @field(resolver: "App\\GraphQL\\Resolvers\\Types\\UserTypeResolver@workDays")
}

# ─── Work days ──────────────────────────────────────────

"How a work day was recorded."
enum EntryMode {
    "Duration typed directly (e.g. 7h30)."
    DURATION @enum(value: "duration")
    "One or more shifts, duration computed."
    SLOTS @enum(value: "slots")
}

"Hours recorded for one day. One per user and per date."
type WorkDay @key(fields: "id") {
    id: ID!
    userId: ID! @rename(attribute: "user_id")
    date: Date!
    mode: EntryMode!
    "Net duration in minutes."
    durationMinutes: Int! @rename(attribute: "duration_minutes")
    note: String
    shifts: [Shift!]! @hasMany
}

"A shift within a day recorded in SLOTS mode."
type Shift {
    id: ID!
    "Start time, HH:MM:SS."
    startTime: String! @rename(attribute: "start_time")
    "End time, HH:MM:SS."
    endTime: String! @rename(attribute: "end_time")
    breakMinutes: Int! @rename(attribute: "break_minutes")
}

# ─── Entry templates ────────────────────────────────────

"Reusable entry template (US-12, US-13)."
type EntryTemplate {
    id: ID!
    label: String
    mode: EntryMode!
    durationMinutes: Int @rename(attribute: "duration_minutes")
    isDefault: Boolean! @rename(attribute: "is_default")
}

# ─── Root operations ────────────────────────────────────

type Query {
    "Entry templates."
    entryTemplates: [EntryTemplate!]! @all
}