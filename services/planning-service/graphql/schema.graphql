#import federation.graphql

# ─── Scalars ────────────────────────────────────────────

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

# ─── User (federated, owned by auth-service) ────────────

# Reference to the user owned by auth-service.
# planning-service contributes the user's work days and entry templates.
type User @key(fields: "id") {
    id: ID!
    "Work days recorded by the user over a period (inclusive bounds)."
    workDays(from: Date!, to: Date!): [WorkDay!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Types\\UserTypeResolver@workDays"
        )
    entryTemplates: [EntryTemplate!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Types\\UserTypeResolver@entryTemplates"
        )
}

# ─── Work days ──────────────────────────────────────────

"How a work day was recorded."
enum EntryMode {
    "Duration typed directly (e.g. 7h30)."
    DURATION @enum(value: "duration")
    "One or more shifts, duration computed."
    SLOTS @enum(value: "slots")
}

"Hours recorded for one day. One per user and per date."
type WorkDay @key(fields: "id") {
    id: ID!
    userId: ID! @rename(attribute: "user_id")
    date: Date!
    mode: EntryMode!
    "Net duration in minutes."
    durationMinutes: Int! @rename(attribute: "duration_minutes")
    note: String
    shifts: [Shift!]! @hasMany
}

"A shift within a day recorded in SLOTS mode."
type Shift {
    id: ID!
    "Start time, HH:MM:SS."
    startTime: String! @rename(attribute: "start_time")
    "End time, HH:MM:SS."
    endTime: String! @rename(attribute: "end_time")
    "Unpaid break deducted from the shift, in minutes. 0 when breaks are paid."
    unpaidBreakMinutes: Int! @rename(attribute: "unpaid_break_minutes")
}

# ─── Entry templates ────────────────────────────────────

"Reusable entry template (US-12, US-13)."
type EntryTemplate {
    id: ID!
    label: String
    mode: EntryMode!
    "Net duration in minutes, computed from the slots in SLOTS mode."
    durationMinutes: Int @rename(attribute: "duration_minutes")
    "Shifts copied into the day when the template is applied (SLOTS mode)."
    slots: [TemplateSlot!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Types\\EntryTemplateTypeResolver@slots"
        )
    isDefault: Boolean! @rename(attribute: "is_default")
}

"A shift stored in an entry template. Times are HH:MM."
type TemplateSlot {
    startTime: String!
    endTime: String!
    unpaidBreakMinutes: Int!
}

# ─── Inputs ─────────────────────────────────────────────

"A shift as typed by the user. Times are HH:MM within the same day."
input ShiftInput {
    startTime: String! @rules(apply: ["date_format:H:i"])
    endTime: String! @rules(apply: ["date_format:H:i"])
    "Unpaid break deducted from the shift. Leave 0 when breaks are paid."
    unpaidBreakMinutes: Int! = 0 @rules(apply: ["integer", "min:0", "max:1440"])
}

"Hours of one day. Give durationMinutes in DURATION mode, shifts in SLOTS mode."
input SaveWorkDayInput {
    date: Date!
    mode: EntryMode!
    durationMinutes: Int
    shifts: [ShiftInput!]! = []
    note: String @rules(apply: ["max:500"])
}

"An entry template. Give durationMinutes in DURATION mode, slots in SLOTS mode."
input EntryTemplateInput {
    label: String! @rules(apply: ["max:100"])
    mode: EntryMode!
    durationMinutes: Int
    slots: [ShiftInput!]! = []
    "Making a template the default removes that status from the previous one."
    isDefault: Boolean! = false
}

"Hours applied to one or several days at once."
input WorkDayHoursInput {
    mode: EntryMode!
    durationMinutes: Int
    shifts: [ShiftInput!]! = []
    note: String @rules(apply: ["max:500"])
}

# ─── Root operations ────────────────────────────────────

type Query {
    "Work days of every user over a period (inclusive bounds, at most 62 days). Admins only."
    teamWorkDays(from: Date!, to: Date!): [WorkDay!]!
        @guard
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Queries\\TeamQuery@teamWorkDays"
        )
}

type Mutation @guard {
    "Record the hours of one day, replacing what was already recorded on that date."
    saveWorkDay(input: SaveWorkDayInput!): WorkDay!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\WorkDayMutation@saveWorkDay"
        )

    "Record the same hours on several days, all or nothing. Days already recorded are replaced."
    saveWorkDays(
        "From 1 to 62 days (about two months)."
        dates: [Date!]! @rulesForArray(apply: ["min:1", "max:62"])
        hours: WorkDayHoursInput!
    ): [WorkDay!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\WorkDayMutation@saveWorkDays"
        )

    "Delete one of the user's days. Returns the deleted day."
    deleteWorkDay(id: ID!): WorkDay!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\WorkDayMutation@deleteWorkDay"
        )

    "Create an entry template."
    createEntryTemplate(input: EntryTemplateInput!): EntryTemplate!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\EntryTemplateMutation@createEntryTemplate"
        )

    "Update one of the user's entry templates."
    updateEntryTemplate(id: ID!, input: EntryTemplateInput!): EntryTemplate!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\EntryTemplateMutation@updateEntryTemplate"
        )

    "Delete one of the user's entry templates. Returns the deleted template."
    deleteEntryTemplate(id: ID!): EntryTemplate!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\Mutations\\EntryTemplateMutation@deleteEntryTemplate"
        )
}
