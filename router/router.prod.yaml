# Apollo Router configuration (production)
supergraph:
  listen: 0.0.0.0:4000
  # Do not hand the full map of the API to anyone who asks.
  introspection: false

sandbox:
  enabled: false
homepage:
  enabled: false

# No CORS policy: the front end and the API share the same origin, behind Caddy.

headers:
  all:
    request:
      operations:
        # The JWT sent by the front end.
        - propagate:
            named: authorization
        # The address typed in the browser, set by Caddy: each service reads the company from it.
        - propagate:
            named: x-forwarded-host

# Subgraph errors stay in the logs, not in the responses sent to the browser.
include_subgraph_errors:
  all: false